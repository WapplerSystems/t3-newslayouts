<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      xmlns:nl="http://typo3.org/ns/WapplerSystems/Newslayouts/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{nl:partialExists(partial: 'List/{settings.templateLayout}')}">
    <f:then>
        <f:render partial="List/{settings.templateLayout}" arguments="{_all}" />
    </f:then>
    <f:else>

        <div class="alert alert-info">Partial List/{settings.templateLayout} not found</div>
    </f:else>
</f:if>

</html>
