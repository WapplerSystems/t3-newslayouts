<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">


<f:if condition="{settings.hidePagination}">
    <f:then>
        <f:for each="{news}" as="newsItem" iteration="iterator">
            <f:render partial="Layouts/List/Item/Default" arguments="{newsItem:newsItem,settings:settings,iterator:iterator,headingType:settings.list.headingType,dummyImage:contentObjectData.dummyImage}"/>
        </f:for>
    </f:then>
    <f:else>
        <f:if condition="{settings.list.paginate.insertAbove}">
            <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator:pagination.paginator, position:'above'}"/>
        </f:if>
        <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
            <f:render partial="Layouts/List/Item/Default" arguments="{newsItem:newsItem,settings:settings,iterator:iterator,headingType:settings.list.headingType,dummyImage:contentObjectData.dummyImage}"/>
        </f:for>
        <f:if condition="{settings.list.paginate.insertBelow}">
            <f:render partial="List/Pagination" arguments="{pagination:pagination.pagination, paginator:pagination.paginator, position:'below'}"/>
        </f:if>
    </f:else>
</f:if>


</html>
