<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      xmlns:nl="http://typo3.org/ns/WapplerSystems/Newslayouts/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="General"/>


<f:section name="content">
    <!--TYPO3SEARCH_end-->
    <f:if condition="{news}">
        <f:then>
            <div class="news-list-view" id="news-container-{contentObjectData.uid}">

                <f:if condition="{nl:partialExists(partial: 'Layouts/List/{settings.templateLayout}')}">
                    <f:then>
                        <f:render partial="Layouts/List/{settings.templateLayout}" arguments="{_all}" />
                    </f:then>
                    <f:else>
                        <div class="alert alert-info">Partial Layouts/List/{settings.templateLayout} not found</div>
                    </f:else>
                </f:if>

            </div>
        </f:then>
        <f:else>
            <div class="no-news-found">
                <f:translate key="list_nonewsfound"/>
            </div>
        </f:else>
    </f:if>
    <!--TYPO3SEARCH_begin-->
</f:section>
</html>
