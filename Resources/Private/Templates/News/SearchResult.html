<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:nl="http://typo3.org/ns/WapplerSystems/Newslayouts/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="General"/>


<f:section name="content">
    <div class="news-search-result">
        <f:if condition="{search}">
            <f:if condition="{news}">
                <f:then>
                    <div class="alert alert-success">
                        <f:translate key="search-text" arguments="{0:'{f:count(subject:news)}',1:search.subject}"/>
                    </div>

                    <f:if condition="{nl:partialExists(partial: 'Layouts/List/{settings.templateLayout}')}">
                        <f:then>
                            <f:render partial="Layouts/List/{settings.templateLayout}" arguments="{_all}" />
                        </f:then>
                        <f:else>
                            <div class="alert alert-info">Partial Layouts/List/{settings.templateLayout} not found</div>
                        </f:else>
                    </f:if>


                </f:then>
                <f:else>
                    <div class="alert alert-info">
                        <f:translate key="search-noresult"/>
                    </div>
                </f:else>
            </f:if>
        </f:if>
    </div>
</f:section>
</html>
